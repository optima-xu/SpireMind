# DeepSeek OpenAI-compatible endpoint. Credentials stay in the environment.
[model]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "deepseek_api_key"
json_mode = true
calculator_mode = "required"
require_exact_model = false
temperature = 0.2
timeout_seconds = 60
max_tokens = 4096

[model.extra_body]
thinking = { type = "disabled" }

[game]
base_url = "http://127.0.0.1:8080"
character = "ironclad"
ascension = 0

[runtime]
context_tokens = 4000
max_context_tokens = 16000
max_steps = 3000

[strategy]
combat_guards = true
boss_potion_damage_fraction = 0.20
