[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spiremind"
version = "0.2.0"
description = "Observable multi-agent runtime with evidence-backed learning and bounded asynchronous I/O"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SpireMind contributors" }]
keywords = ["slay-the-spire-2", "agent", "llm", "openai-compatible", "game-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Turn Based Strategy",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/optima-xu/SpireMind"
Repository = "https://github.com/optima-xu/SpireMind.git"
Issues = "https://github.com/optima-xu/SpireMind/issues"
Changelog = "https://github.com/optima-xu/SpireMind/blob/main/CHANGELOG.md"

[project.scripts]
spiremind = "spiremind.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/spiremind"]

[tool.hatch.build.targets.sdist]
exclude = ["/runs/**", "/.uv-cache/**", "/.venv/**", "/.tools/**", "/web/node_modules/**"]
include = [
  "src",
  "tests",
  "scripts",
  "patches",
  ".github",
  "/.env.example",
  ".gitignore",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "README.zh-CN.md",
  "spiremind.cmd",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "bridge.lock.json",
  "config.example.toml",
  "docs/ARCHITECTURE.md",
  "docs/DEPLOYMENT.md",
  "web/package.json",
  "web/index.html",
  "web/src",
  "web/dist",
  "pyproject.toml",
  "uv.lock",
]
