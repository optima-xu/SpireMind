name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, `.env` contents, saves, or unredacted private endpoints.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: SpireMind commit/release, Python, game and bridge versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or a redacted fixture that reproduces the issue
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Diagnostics
      description: Relevant redacted summary/error counters; avoid uploading complete private traces
